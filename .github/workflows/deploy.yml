name: Deploy

on:
  push:
    # Claude's working branch deploys too, so changes go live without a merge.
    branches: [main, claude/project-thread-ddbq8e]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one rather than cancelling it mid-stack-update.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # lets the job assume the AWS role via OIDC, no stored keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Test the Concierge API
        run: |
          npm ci --prefix api
          npm test --prefix api

      - name: Deploy
        run: ./infra/deploy.sh
        env:
          STACK_NAME: ${{ vars.STACK_NAME || 'casaguapo' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERT_ARN: ${{ vars.CERT_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
