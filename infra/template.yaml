AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Casaguapo. Static site on S3 behind CloudFront, plus the AI Concierge
  (Lambda + HTTP API) served from the same domain under /api/*.

Parameters:
  AnthropicKeyParameterName:
    Type: String
    Default: casaguapo/anthropic-api-key
    Description: SSM Parameter Store name (SecureString, without the leading slash) holding the Anthropic API key.
  ClaudeModel:
    Type: String
    Default: claude-sonnet-5-5
  ApiRateLimit:
    Type: Number
    Default: 5
    Description: Steady-state requests per second allowed to the Concierge API, across all visitors.
  ApiBurstLimit:
    Type: Number
    Default: 10
  DomainName:
    Type: String
    Default: ''
    Description: >-
      Optional custom domain. With HostedZoneId, the bare domain (example.com), served on example.com and
      www.example.com. With CertificateArn instead, a single host such as www.example.com.
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN of an issued ACM certificate in us-east-1 that covers DomainName.
  HostedZoneId:
    Type: String
    Default: ''
    Description: >-
      Route 53 hosted zone for DomainName. The stack then issues the certificate and creates the DNS records
      itself. Deploy in us-east-1.

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  UseRoute53: !And
    - !Condition HasDomainName
    - !Not [!Equals [!Ref HostedZoneId, '']]
  UseCertificateArn: !And
    - !Condition HasDomainName
    - !Not [!Equals [!Ref CertificateArn, '']]
    - !Not [!Condition UseRoute53]
  HasCustomDomain: !Or
    - !Condition UseRoute53
    - !Condition UseCertificateArn

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30

Resources:
  # ---------- Static site ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Astro builds /services/ as /services/index.html; S3 needs the full key.
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-index-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html to directory requests
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/') + 1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # ---------- Concierge API ----------
  ConciergeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit

  ConciergeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../api
      Handler: handler.handler
      Environment:
        Variables:
          ANTHROPIC_KEY_PARAM: !Sub '/${AnthropicKeyParameterName}'
          CLAUDE_MODEL: !Ref ClaudeModel
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref AnthropicKeyParameterName
      Events:
        Concierge:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConciergeApi
            Path: /api/concierge
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints: [src/handler.ts]
        External: ['@aws-sdk/*']

  ConciergeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ConciergeFunction}'
      RetentionInDays: 14

  # ---------- CDN ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: !If
          - UseRoute53
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - !If [UseCertificateArn, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !If [UseRoute53, !Ref SiteCertificate, !Ref CertificateArn]
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${ConciergeApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  # Route 53 mode: a certificate for example.com and www.example.com, validated through the hosted zone.
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: UseRoute53
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: UseRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        # Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone ID for alias records.
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub 'www.${DomainName}'
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  SiteUrl:
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
  CloudFrontDomain:
    Description: Point your domain's CNAME record here.
    Value: !GetAtt Distribution.DomainName
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
